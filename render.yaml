# Render Blueprint — see DEPLOY_RENDER.md
# Set every value marked `sync: false` in the Render dashboard (Environment tab).
# Never commit real keys to this file.
services:
  - type: web
    name: lockedge
    runtime: node
    plan: starter # free instances sleep — see DEPLOY_RENDER.md before choosing "free"
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/engine-status
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DEPLOY_TARGET
        value: node-server
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SUPABASE_PROJECT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: POLL_SECRET
        sync: false
      - key: POLL_INTERVAL_MS
        value: "2000"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: THEODDSAPI_KEY
        sync: false
